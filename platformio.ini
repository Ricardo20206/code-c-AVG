; Ventec Systems - Carte de monitoring AGV
;
; Carte Ventec PRODUCTION :
;   MCU  ESP32-PICO-D4 (flash 4 Mo intégrée, mode DIO)
;   PSRAM ISSI IS66WVS1M8BLL-104NLI (1 Mo, quad SPI, CS=GPIO10 CLK=GPIO6)
;   → [env:ventec_monitor]  (DEFAUT)
;
; ESP32 DevKit WROOM sans PSRAM (tests USB seulement)
;   → [env:ventec_monitor_no_psram]

[platformio]
default_envs = ventec_monitor
boards_dir = boards

[env:ventec_monitor]
platform = espressif32
board = ventec_agv_monitor
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter, default
board_build.partitions = default.csv
board_build.psram = enabled
board_build.sdkconfig_defaults = sdkconfig.defaults
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DVENTEC_PSRAM_IS66WVS1M8BLL=1
    -DVENTEC_PSRAM_REQUIRED=1
    -mfix-esp32-psram-cache-issue
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2
    adafruit/Adafruit INA237 and INA238 Library
    https://github.com/edovis/TMP126.git
    adafruit/Adafruit LIS3DH@^1.2.4
    adafruit/Adafruit SHT31 Library@^2.2.2
    adafruit/RTClib@^2.1.4

; Carte Ventec PICO-D4 — poursuite sans PSRAM (tests LED / capteurs / BLE)
[env:ventec_monitor_lab]
extends = env:ventec_monitor
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DVENTEC_PSRAM_IS66WVS1M8BLL=1
    -DVENTEC_PSRAM_REQUIRED=0
    -mfix-esp32-psram-cache-issue

[env:ventec_monitor_no_psram]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter, default
board_build.partitions = default.csv
board_build.psram = disabled
build_flags =
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2
    adafruit/Adafruit INA237 and INA238 Library
    https://github.com/edovis/TMP126.git
    adafruit/Adafruit LIS3DH@^1.2.4
    adafruit/Adafruit SHT31 Library@^2.2.2
    adafruit/RTClib@^2.1.4
