; Ventec Systems - Carte de monitoring AGV
;
; Carte Ventec avec PSRAM (module WROVER ou équivalent)
; → utiliser [env:ventec_monitor] (défaut)
;
; ESP32 DevKit de test SANS PSRAM (CP2102, WROOM seul)
; → utiliser [env:ventec_monitor_no_psram]

[env:ventec_monitor]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter, default
board_build.partitions = default.csv
; Active la PSRAM au niveau SDK (obligatoire si la carte en a une)
board_build.psram = enabled
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2
    adafruit/Adafruit INA219@^1.2.3
    adafruit/Adafruit TMP117@^1.0.2
    adafruit/Adafruit LIS3DH@^1.2.4
    adafruit/Adafruit SHT31 Library@^2.2.2
    adafruit/RTClib@^2.1.4

; DevKit USB de test sans PSRAM (évite l'erreur spiram sur WROOM)
[env:ventec_monitor_no_psram]
extends = env:ventec_monitor
board_build.psram = disabled
build_flags =
    -DCORE_DEBUG_LEVEL=1
